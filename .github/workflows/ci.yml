---
name: CI

on: # yamllint disable-line rule:truthy
  push:
  pull_request:

jobs:
  pre-commit:
    name: ✨ Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Use Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
